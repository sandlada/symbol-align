[package]
name = "symbol-align-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust core of the symbol-align code-snippet formatter"

[lib]
name = "symbol_align_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
