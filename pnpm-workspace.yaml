packages:
  - "packages/*"

# Shared dependency versions for all workspace packages.
# Reference them with the `catalog:` protocol (e.g. "vitest": "catalog:").
catalog:
  "@biomejs/biome": ^2.6.2
  "@types/node": ^26.6.5
  "@types/vscode": ^1.95.0
  "@vscode/vsce": ^4.0.0
  esbuild: ^0.28.2
  tsx: ^4.23.15
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.0.5

# Packages that are allowed to run install scripts.
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
